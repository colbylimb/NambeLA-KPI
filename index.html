<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nambe Drugs Scorecard</title>
  <meta name="description" content="Daily Rx processed, vaccine and compound counts for Nambe Drugs Los Alamos.">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <img class="logo" src="assets/logo.png" alt="Nambe Drugs Los Alamos">
      <div class="divider"></div>
      <div class="title-block">
        <h1>Daily Scorecard</h1>
        <p>Rx processed, vaccines &amp; compounds · updated nightly at midnight</p>
      </div>
      <div class="spacer"></div>
      <span class="sample-pill" id="sample-pill" hidden>Sample data</span>
      <span class="status" id="status">Loading…</span>
      <div class="clock">
        <div class="time" id="clock-time">--:--</div>
        <div class="date" id="clock-date"></div>
      </div>
      <a class="gear" href="upload.html" title="Upload data" aria-label="Upload data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </a>
    </header>

    <main class="grid" id="grid">
      <div class="empty">Loading the latest counts…</div>
    </main>

    <footer class="footer">
      <span id="footnote">Comparisons use the same date last month.</span>
      <span>Data reflects the day the Rx was entered.</span>
    </footer>
  </div>

  <!-- After-hours screensaver (outside SHOW_FROM–SHOW_UNTIL in app.js) -->
  <div class="screensaver" id="screensaver" hidden>
    <svg class="ss-art" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs><clipPath id="ss-cap"><rect x="-90" y="-230" width="180" height="460" rx="90"/></clipPath></defs>
      <g transform="translate(1310 170) rotate(-35)" clip-path="url(#ss-cap)"><rect x="-90" y="-230" width="180" height="230" fill="#50B341" opacity=".18"/><rect x="-90" y="0" width="180" height="230" fill="#0A9F41" opacity=".10"/></g>
      <g transform="translate(240 760) rotate(28)"><rect x="-70" y="-180" width="140" height="360" rx="70" fill="#0A9F41" opacity=".14"/></g>
      <circle cx="1480" cy="820" r="220" fill="#50B341" opacity=".07"/>
      <circle cx="90" cy="110" r="140" fill="#DDF0E3" opacity=".05"/>
    </svg>
    <div class="ss-content" id="ss-content">
      <div class="ss-badge"><img src="assets/logo.png" alt="Nambe Drugs Los Alamos"></div>
      <div class="ss-time" id="ss-time">--:--</div>
      <div class="ss-date" id="ss-date"></div>
      <div class="ss-rule"></div>
      <div class="ss-tag">Your pharmacy in <span>Los Alamos.</span></div>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
