<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nambe Drugs Scorecard</title>
  <meta name="description" content="Daily Rx processed, vaccine and compound counts for Nambe Drugs Los Alamos.">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <img class="logo" src="assets/logo.png" alt="Nambe Drugs Los Alamos">
      <div class="divider"></div>
      <div class="title-block">
        <h1>Daily Scorecard</h1>
        <p>Rx processed, vaccines &amp; compounds · updated nightly at midnight</p>
      </div>
      <div class="spacer"></div>
      <span class="sample-pill" id="sample-pill" hidden>Sample data</span>
      <span class="status" id="status">Loading…</span>
      <div class="clock">
        <div class="time" id="clock-time">--:--</div>
        <div class="date" id="clock-date"></div>
      </div>
      <a class="gear" href="upload.html" title="Upload data" aria-label="Upload data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </a>
    </header>

    <main class="grid" id="grid">
      <div class="empty">Loading the latest counts…</div>
    </main>

    <footer class="footer">
      <span id="footnote">Comparisons use the same date last month.</span>
      <span>Data reflects the day the Rx was entered.</span>
    </footer>
  </div>

  <!-- After-hours screensaver (outside SHOW_FROM–SHOW_UNTIL in app.js) -->
  <div class="screensaver" id="screensaver" hidden>
    <svg class="ss-art" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g transform="translate(1350 200) rotate(-35)"><path d="M-105.0,-3.5 V-168.5 A105.0,105.0 0 0 1 105.0,-168.5 V-3.5 Z" fill="#50B341" opacity="0.55"/><path d="M-105.0,3.5 V168.5 A105.0,105.0 0 0 0 105.0,168.5 V3.5 Z" fill="#0F4A2E" opacity="0.3"/></g>
      <g transform="translate(250 780) rotate(32)"><path d="M-85.0,-3.5 V-138.5 A85.0,85.0 0 0 1 85.0,-138.5 V-3.5 Z" fill="#DDF0E3" opacity="0.3"/><path d="M-85.0,3.5 V138.5 A85.0,85.0 0 0 0 85.0,138.5 V3.5 Z" fill="#0F4A2E" opacity="0.28"/></g>
      <g transform="translate(160 170) rotate(58)"><path d="M-52.0,-3.5 V-86.5 A52.0,52.0 0 0 1 52.0,-86.5 V-3.5 Z" fill="#50B341" opacity="0.45"/><path d="M-52.0,3.5 V86.5 A52.0,52.0 0 0 0 52.0,86.5 V3.5 Z" fill="#0F4A2E" opacity="0.25"/></g>
      <g transform="translate(1520 820) rotate(-62)"><path d="M-70.0,-3.5 V-113.5 A70.0,70.0 0 0 1 70.0,-113.5 V-3.5 Z" fill="#DDF0E3" opacity="0.26"/><path d="M-70.0,3.5 V113.5 A70.0,70.0 0 0 0 70.0,113.5 V3.5 Z" fill="#50B341" opacity="0.45"/></g>
      <g transform="translate(820 80) rotate(80)"><path d="M-35.0,-3.5 V-58.5 A35.0,35.0 0 0 1 35.0,-58.5 V-3.5 Z" fill="#50B341" opacity="0.3"/><path d="M-35.0,3.5 V58.5 A35.0,35.0 0 0 0 35.0,58.5 V3.5 Z" fill="#0F4A2E" opacity="0.2"/></g>
      <circle cx="1090" cy="120" r="12" fill="#50B341" opacity=".55"/>
      <circle cx="430" cy="560" r="9" fill="#DDF0E3" opacity=".35"/>
      <circle cx="1250" cy="700" r="14" fill="#50B341" opacity=".45"/>
      <circle cx="560" cy="210" r="7" fill="#DDF0E3" opacity=".4"/>
    </svg>
    <div class="ss-content" id="ss-content">
      <div class="ss-badge"><img src="assets/logo.png" alt="Nambe Drugs Los Alamos"></div>
      <div class="ss-time" id="ss-time">--:--</div>
      <div class="ss-date" id="ss-date"></div>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
